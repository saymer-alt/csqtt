name: CSQTT ARM64 musl build only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Pinned build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-unknown-linux-musl
          python3 -m venv /tmp/csqtt-build-tools
          /tmp/csqtt-build-tools/bin/pip install ziglang==0.15.2 cargo-zigbuild==0.23.4
          echo /tmp/csqtt-build-tools/bin >> "$GITHUB_PATH"
      - name: Build original client only
        run: cargo +1.97.1 zigbuild --manifest-path rust-client/Cargo.toml --release --locked --target aarch64-unknown-linux-musl
      - name: Verify ELF and record provenance
        run: |
          set -euo pipefail
          mkdir evidence
          cp target/aarch64-unknown-linux-musl/release/client evidence/csqtt-client-linux-arm64-musl
          cp LICENSE evidence/LICENSE
          cp BUILD-ARM64.md evidence/BUILD-ARM64.md
          binary=evidence/csqtt-client-linux-arm64-musl
          file "$binary" | tee evidence/file.txt
          readelf -h "$binary" | tee evidence/elf-header.txt
          readelf -l "$binary" > evidence/elf-program-headers.txt
          readelf -d "$binary" | tee evidence/elf-dynamic.txt
          grep -Eq 'Class: +ELF64' evidence/elf-header.txt
          grep -Eq 'Machine: +AArch64' evidence/elf-header.txt
          grep -Eq "Data: +2.s complement, little endian" evidence/elf-header.txt
          ! grep -q INTERP evidence/elf-program-headers.txt
          ! grep -q '(NEEDED)' evidence/elf-dynamic.txt
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo upstream_base=71712b07dbabe16fa43f5a248dc69e1ab9f3a270
            echo reference_commit=5c3cf032dade852a92bf1f2cf2bc6cd7008c428c
            rustc +1.97.1 --version
            cargo +1.97.1 --version
            zig version
            cargo-zigbuild --version
            wc -c < "$binary"
          } | tee evidence/provenance.txt
          (cd evidence && sha256sum csqtt-client-linux-arm64-musl LICENSE BUILD-ARM64.md) | tee evidence/SHA256SUMS
      - name: Testing artifact only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: csqtt-arm64-musl-testing-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
